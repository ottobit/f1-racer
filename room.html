<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/images/app-icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="F1 Racer" />
  <meta name="theme-color" content="#05060a" />
  <title>Stanza multiplayer — F1 Racer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>" />
  <meta name="description" content="F1 Racer — stanza multiplayer: crea o entra in una stanza e scegli il pilota." />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="core/client/style.css?v=36" />
</head>
<body class="f1-home room-page">
  <header class="f1-home-hero room-hero">
    <p class="f1-home-kicker"><a href="./">← TORNA A F1 RACER</a></p>
    <h1 class="wordmark">Stanza multiplayer</h1>
    <p class="f1-home-lead">Crea o entra in una stanza, scegli il pilota — l'host sceglie circuito e difficoltà, poi qualifica e gara si corrono davvero insieme.</p>
  </header>

  <section class="f1-home-section room-lobby">
    <div id="room-entry" class="room-entry">
      <label class="room-field">Nome<input id="room-nickname" type="text" maxlength="24" placeholder="Il tuo nome" autocomplete="off" /></label>
      <div class="room-entry-actions">
        <button id="room-create-btn" type="button" class="room-btn room-btn--primary">Crea una stanza</button>
        <div class="room-join-row">
          <input id="room-code-input" type="text" maxlength="4" placeholder="CODICE" autocapitalize="characters" autocomplete="off" />
          <button id="room-join-btn" type="button" class="room-btn">Entra</button>
        </div>
      </div>
      <p id="room-entry-status" class="room-status" role="status" aria-live="polite"></p>
    </div>

    <div id="room-view" class="room-view" hidden>
      <div class="room-view-head">
        <div class="room-code-block"><span>Codice stanza</span><strong id="room-code-display"></strong></div>
        <button id="room-leave-btn" type="button" class="room-btn room-btn--ghost">Esci</button>
      </div>
      <p id="room-connection-status" class="room-status" role="status" aria-live="polite"></p>
      <p id="room-view-status" class="room-status" role="status" aria-live="polite"></p>

      <div class="room-participants">
        <h2>Partecipanti <span id="room-participant-count"></span></h2>
        <ul id="room-participant-list"></ul>
      </div>

      <div class="room-drivers">
        <h2>Scegli il pilota</h2>
        <div id="room-driver-grid" class="room-driver-grid" role="radiogroup" aria-label="Pilota"></div>
      </div>

      <div id="room-session-setup" class="room-session-setup">
        <h2>Circuito e difficoltà</h2>
        <div id="room-circuit-host" class="room-session-fields" hidden>
          <label class="room-field">Circuito
            <select id="room-circuit-select"><option value="">— scegli —</option></select>
          </label>
          <label class="room-field">Difficoltà
            <select id="room-difficulty-select">
              <option value="facile">Facile</option>
              <option value="normale" selected>Normale</option>
              <option value="difficile">Difficile</option>
            </select>
          </label>
        </div>
        <p id="room-circuit-display" class="room-status"></p>
      </div>

      <div class="room-actions">
        <label class="room-ready-toggle"><input id="room-ready-checkbox" type="checkbox" /> Pronto</label>
        <button id="room-start-btn" type="button" class="room-btn room-btn--primary" hidden>Avvia (solo host)</button>
      </div>
      <p id="room-race-started" class="room-status room-status--started" hidden></p>
    </div>
  </section>

  <script type="module" src="core/client/multiplayer/room.js?v=4"></script>
</body>
</html>
