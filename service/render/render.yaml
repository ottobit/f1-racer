# Render Blueprint (#333): the multiplayer room server. The game itself stays
# on GitHub Pages; this only runs core/server/room-server.mjs. Point Render's
# Blueprint at this file (service/render/render.yaml); the provider-neutral
# contract it follows is in service/README.md. Mirrors the live service
# (srv-db0m6fm0tbcc738f3ek0, created from Render's API): no rootDir, so the
# commands enter core/ themselves.
services:
  - type: web
    name: f1-racer-rooms
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd core && npm ci
    startCommand: node core/server/room-server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The free plan sleeps after 15 idle minutes: the server's own cron
      # pings /health every 10 minutes, all day (~744 of the 750 free hours
      # a month: no room for a second free service on this account).
      # Update the URL if Render assigns a different address.
      - key: KEEP_AWAKE_URL
        value: https://f1-racer-rooms.onrender.com
      - key: KEEP_AWAKE_CRON
        value: "*/10 * * * *"
      - key: KEEP_AWAKE_TZ
        value: Europe/Rome
