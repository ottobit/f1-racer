# Render Blueprint (#333): the multiplayer room server. The game itself stays
# on GitHub Pages; this only runs core/server/room-server.mjs. Point Render's
# Blueprint at this file (service/render/render.yaml); the provider-neutral
# contract it follows is in service/README.md. rootDir is relative to the repo.
services:
  - type: web
    name: f1-racer-rooms
    runtime: node
    plan: free
    region: frankfurt
    rootDir: core
    buildCommand: npm ci --omit=dev
    startCommand: node server/room-server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The free plan sleeps after 15 idle minutes: the server's own cron
      # pings /health every 10 minutes from 9:00 to 3:00 Italian time.
      # Update the URL if Render assigns a different address.
      - key: KEEP_AWAKE_URL
        value: https://f1-racer-rooms.onrender.com
      - key: KEEP_AWAKE_CRON
        value: "*/10 9-23,0-2 * * *"
      - key: KEEP_AWAKE_TZ
        value: Europe/Rome
