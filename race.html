<!DOCTYPE html>
<html lang="it" class="race">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>F1 Racer — ottobit arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>" />
  <meta name="description" content="Time trial 3D su circuito misto, su una griglia da 10 auto. Giocabile subito nel browser." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ottobit.github.io/portfolio-arcade/games/f1-racer/" />
  <meta property="og:title" content="F1 Racer — ottobit arcade" />
  <meta property="og:description" content="Time trial 3D su circuito misto, su una griglia da 10 auto. Giocabile subito nel browser." />
  <meta property="og:image" content="https://ottobit.github.io/portfolio-arcade/assets/images/og-f1-racer.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="F1 Racer — ottobit arcade" />
  <meta name="twitter:description" content="Time trial 3D su circuito misto, su una griglia da 10 auto. Giocabile subito nel browser." />
  <meta name="twitter:image" content="https://ottobit.github.io/portfolio-arcade/assets/images/og-f1-racer.jpg" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="style.css?v=20" />
  <script>
    // Touch-capability detection done in JS, not just CSS: the
    // (hover: none) and (pointer: coarse) media query is the "correct"
    // way to ask this, but some mobile browsers report it inconsistently,
    // which was hiding the on-screen controls on real devices. Checking
    // touch support directly is more reliable. `?touch=1` / `?touch=0` in
    // the URL forces it either way, for testing without a phone in hand.
    (function () {
      var forced = new URLSearchParams(location.search).get("touch");
      var isTouch =
        forced === "1" ||
        (forced !== "0" &&
          ("ontouchstart" in window || navigator.maxTouchPoints > 0));
      if (isTouch) document.documentElement.classList.add("touch");
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <!-- Used to live tucked in the top-left corner, small enough that it sat
         right on the horizon — half against the dark sky, half against the
         lighter track surface behind it. A full-width bar right at the very
         top of the screen stays clear of that seam regardless of viewport
         shape, and reads as a proper speed readout instead of a tiny badge. -->
    <div id="speedbar" class="hud-panel">
      <div id="shift-lights" aria-hidden="true">
        <span class="shift-led"></span><span class="shift-led"></span>
        <span class="shift-led"></span><span class="shift-led"></span>
        <span class="shift-led"></span><span class="shift-led"></span>
        <span class="shift-led"></span><span class="shift-led"></span>
      </div>
      <span id="drs-indicator" aria-hidden="true">DRS</span>
      <div id="speed-track" aria-hidden="true">
        <div id="speed-fill"></div>
      </div>
      <div class="speedo-readout">
        <span id="gear-value" aria-hidden="true">N</span>
        <span id="speed-value">0</span>
        <span class="speedo-unit">km/h</span>
      </div>
    </div>
    <div id="hud-row">
      <a class="back-link hud-panel" href="index.html">← circuiti</a>
      <div class="stats hud-panel">
        <div id="circuit-name" class="circuit-name"></div>
        <div class="stats-row stats-row--primary">
          <span id="position">P-</span>
          <span class="stats-sep">·</span>
          <span id="lap">Giro 0/3</span>
        </div>
        <div class="stats-row">
          <span id="time">0:00.00</span>
          <span id="best">Migliore --:--.--</span>
        </div>
        <div class="stats-row">
          <span id="tire-wear">Gomme 100%</span>
        </div>
        <div id="damage-row" class="stats-row" hidden>
          <span id="damage">Danni 0%</span>
        </div>
      </div>
      <canvas id="minimap" width="130" height="130" aria-hidden="true"></canvas>
    </div>
  </div>

  <div id="hint">WASD / frecce per guidare — 3 giri contro 9 rivali</div>

  <div id="penalty-notice" aria-hidden="true">Track limits — +1.0s</div>

  <div id="countdown-overlay" hidden></div>

  <div id="touch-controls">
    <div id="wheel-control" class="touch-group touch-group--steer" role="slider" aria-label="Sterzo">
      <svg viewBox="0 0 140 140" aria-hidden="true">
        <defs>
          <radialGradient id="wheel-rim-gradient" cx="50%" cy="32%" r="80%">
            <stop offset="0%" stop-color="#33363f" />
            <stop offset="100%" stop-color="#0e0f14" />
          </radialGradient>
          <linearGradient id="wheel-hub-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ff3226" />
            <stop offset="100%" stop-color="#a80700" />
          </linearGradient>
          <pattern id="wheel-grip" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="5" stroke="rgba(255,255,255,0.07)" stroke-width="1.6" />
          </pattern>
          <clipPath id="wheel-rim-clip">
            <path d="M20,68 A50,50 0 1 1 120,68 L120,96 A12,12 0 0 1 108,108 L32,108 A12,12 0 0 1 20,96 Z" />
          </clipPath>
        </defs>

        <path d="M20,68 A50,50 0 1 1 120,68 L120,96 A12,12 0 0 1 108,108 L32,108 A12,12 0 0 1 20,96 Z"
          fill="url(#wheel-rim-gradient)" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" />
        <rect x="18" y="16" width="104" height="94" fill="url(#wheel-grip)" clip-path="url(#wheel-rim-clip)" />
        <path d="M26,62 A44,44 0 0 1 114,62" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2" stroke-linecap="round" />

        <circle cx="33" cy="49" r="4.5" fill="#1c5fd6" stroke="rgba(255,255,255,0.35)" stroke-width="1" />
        <circle cx="107" cy="49" r="4.5" fill="#1c5fd6" stroke="rgba(255,255,255,0.35)" stroke-width="1" />

        <rect x="63" y="16" width="14" height="24" rx="3" fill="#e6c229" stroke="rgba(0,0,0,0.25)" stroke-width="1" />

        <circle cx="70" cy="70" r="18" fill="url(#wheel-hub-gradient)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
        <circle cx="70" cy="70" r="18" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1" />
        <circle cx="65" cy="64" r="5" fill="rgba(255,255,255,0.25)" />
      </svg>
    </div>
    <div class="touch-group touch-group--throttle">
      <button id="btn-brake" class="touch-btn" aria-label="Freno">▼</button>
      <button id="btn-gas" class="touch-btn touch-btn--big" aria-label="Acceleratore">▲</button>
    </div>
  </div>

  <div id="results-overlay" hidden>
    <div class="results-card">
      <h2 id="results-title">Gara finita</h2>
      <ol id="results-order"></ol>
      <p id="results-points"></p>
      <div class="results-actions">
        <a id="results-next" class="results-btn results-btn--primary" href="index.html">Prossimo circuito</a>
        <a class="results-btn" href="index.html">Torna ai circuiti</a>
      </div>
    </div>
  </div>

  <script type="module" src="main.js?v=16"></script>
</body>
</html>
