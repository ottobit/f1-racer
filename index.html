<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Racer — ottobit arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>" />
  <meta name="description" content="Mini-campionato 3D: 5 circuiti, griglia da 10 auto, classifica a punti. Giocabile subito nel browser." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ottobit.github.io/portfolio-arcade/games/f1-racer/" />
  <meta property="og:title" content="F1 Racer — ottobit arcade" />
  <meta property="og:description" content="Mini-campionato 3D: 5 circuiti, griglia da 10 auto, classifica a punti. Giocabile subito nel browser." />

  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="style.css?v=14" />
</head>
<body>
  <header>
    <h1 class="wordmark">F1 Racer</h1>
    <p>5 circuiti, griglia da 10 auto, classifica a punti.<br />Vinci più gare degli altri per diventare campione del mondo.</p>
  </header>

  <div id="champion-banner" hidden></div>

  <div id="difficulty-select" class="difficulty-select" role="radiogroup" aria-label="Difficoltà avversari"></div>

  <div class="menu-standings">
    <table>
      <thead>
        <tr><th>Pos.</th><th>Pilota</th><th>Punti</th></tr>
      </thead>
      <tbody id="standings-body"></tbody>
    </table>
  </div>

  <main>
    <div id="circuit-list" class="grid"></div>
  </main>

  <div class="menu-actions">
    <button id="reset-btn" class="reset-btn" type="button">Azzera campionato</button>
  </div>

  <footer>
    <a href="../../">← arcade</a>
  </footer>

  <script type="module" src="menu.js"></script>
</body>
</html>
